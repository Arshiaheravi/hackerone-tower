name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Verify dependencies
        run: python -m pip check
      - name: Lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Test isolated public-data and delivery workflows
        run: python -m pytest --cov=tower --cov-report=term-missing --cov-report=xml
      - name: Exercise the offline demo from source
        run: python -m tower demo
      - name: Build distribution wheel with the pinned build backend
        run: python -m pip wheel --disable-pip-version-check --no-deps --wheel-dir dist .
      - name: Install and exercise the wheel outside the source checkout
        run: python -m ci.smoke_package --wheel-dir dist
      - name: Validate Windows script syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $allErrors = @()
          Get-ChildItem -LiteralPath scripts -Filter *.ps1 | ForEach-Object {
            $parseErrors = $null
            $tokens = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            $allErrors += $parseErrors
          }
          if ($allErrors.Count -gt 0) {
            $allErrors | ForEach-Object { Write-Error $_ }
            exit 1
          }

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify and run the pinned secret scanner
        shell: bash
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact=100 --log-opts=--all .

  container:
    name: Docker build and offline runtime
    needs: [test, secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the application image
        run: docker build --pull --tag hackerone-tower:ci .
      - name: Verify the image defaults to the unprivileged service user
        run: test "$(docker image inspect --format '{{ .Config.User }}' hackerone-tower:ci)" = "10001:10001"
      - name: Run the container demo without network access or credentials
        run: >-
          docker run --rm --network none --no-healthcheck
          --read-only --cap-drop ALL --security-opt no-new-privileges
          --tmpfs /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
          --cpus 1 --memory 512m --pids-limit 64
          hackerone-tower:ci demo
